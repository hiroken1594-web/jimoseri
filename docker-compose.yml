# ローカル開発専用の Postgres。本番は Neon を使う。
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jimoseri
      POSTGRES_PASSWORD: jimoseri_local
      POSTGRES_DB: jimoseri
    ports:
      - "54329:5432"
    volumes:
      - jimoseri_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jimoseri -d jimoseri"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  jimoseri_pgdata:
